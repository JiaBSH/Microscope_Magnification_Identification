[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rate-identification"
version = "0.1.0"
description = "Continuous visual scale estimation for adaptive sliding windows on microscopy images."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "Pillow>=10.0",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dinov2 = [
  "timm>=0.9.12",
  "torch>=2.1",
  "torchvision>=0.16",
]

[project.scripts]
rate-identification = "rate_identification.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
